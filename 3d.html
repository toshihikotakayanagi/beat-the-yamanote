<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1b1d22">
  <meta name="description" content="東京の本物の道を自転車で走り、山手線より先に次の駅を目指すレースゲーム（3D版）">
  <title>山手線に勝て！ 3D</title>
  <link rel="stylesheet" href="style.css">
  <!-- 3D の描画は Three.js（CDN から読み込む。版を固定する） -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <!-- 3D の世界（下）と、HUD・メニュー（上。背景は透明） -->
  <canvas id="view3d" aria-hidden="true"></canvas>
  <canvas id="game" aria-label="ゲーム画面"></canvas>

  <!-- 右上：音のオン／オフ、レース中止（スマホ用） -->
  <div id="corner">
    <button id="quit" type="button" hidden aria-label="区間選択に戻る">✕</button>
    <button id="camera" type="button" aria-label="視点の切り替え">視点</button>
    <button id="sound" type="button" aria-label="音のオン／オフ">音 ON</button>
  </div>

  <!-- スマホ用の操作ボタン（タッチ操作の端末で、レース中だけ表示） -->
  <div id="touch" hidden>
    <div class="pad">
      <button type="button" data-key="left" aria-label="左">◀</button>
      <button type="button" data-key="right" aria-label="右">▶</button>
    </div>
    <div class="pad">
      <button type="button" data-key="down" class="brake" aria-label="ブレーキ">ブレーキ</button>
      <button type="button" data-key="up" class="accel" aria-label="アクセル">アクセル</button>
    </div>
  </div>

  <script type="module" src="src/main3d.js"></script>
</body>
</html>
