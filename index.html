<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1b1d22">
  <meta name="description" content="東京の本物の道を自転車で走り、山手線より先に次の駅を目指すレースゲーム">
  <title>山手線に勝て！</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="ゲーム画面"></canvas>

  <!-- 右上：音のオン／オフ、一時停止（レース中）、レース中止（スマホ用） -->
  <div id="corner">
    <button id="quit" type="button" hidden aria-label="区間選択に戻る">✕</button>
    <button id="pause" type="button" hidden aria-label="一時停止" title="一時停止（P）">❚❚</button>
    <button id="sound" type="button" aria-label="音のオン／オフ">音 ON</button>
  </div>

  <!-- スマホ用の操作ボタン（タッチ操作の端末で、レース中だけ表示） -->
  <div id="touch" hidden>
    <div class="pad">
      <button type="button" data-key="left" aria-label="左">◀</button>
      <button type="button" data-key="right" aria-label="右">▶</button>
    </div>
    <div class="pad">
      <button type="button" data-key="down" class="brake" aria-label="ブレーキ">ブレーキ</button>
      <button type="button" data-key="up" class="accel" aria-label="アクセル">アクセル</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
